[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "law-n-sql-core"
version = "0.1.0"
description = "Core prototype implementation of N-SQL, the Law-N network-native query language."
authors = [
    { name = "Peace Thabiwa", email = "you@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
n-sql = "n_sql_core.cli:main"
